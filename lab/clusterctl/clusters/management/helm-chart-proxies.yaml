# Este archivo mantiene los helm charts que se instalan con un plugin de
# clusterapi llamado helm addon
# https://github.com/kubernetes-sigs/cluster-api-addon-provider-helm/
---
apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: cilium
spec:
  clusterSelector:
    matchLabels:
      baseHelmCharts: tooling
  repoURL: https://helm.cilium.io/
  chartName: cilium
  namespace: kube-system
  version: 1.17.6
  options:
    waitForJobs: true
    wait: true
    timeout: 5m
    install:
      createNamespace: true
  valuesTemplate: |
    hubble:
      enabled: true
      metrics:
        enableOpenMetrics: true
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - source_namespace
          - source_workload
          - destination_ip
          - destination_namespace
          - destination_workload
          - traffic_direction
      relay:
        enabled: true
      ui:
        enabled: true
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList:
          - 10.11.0.0/16
    l2announcements:
      enabled: true
      leaseDuration: 10s
      leaseRenewDeadline: 5s
      leaseRetryPeriod: 1s
    kubeProxyReplacement: true
    k8sServiceHost: 10.77.100.3
    k8sServicePort: 6443
    k8sClientRateLimit.qps: ${QPS}
    k8sClientRateLimit.burst: ${BURST}
---
apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: cilium-raw-lb
spec:
  clusterSelector:
    matchLabels:
      baseHelmCharts: tooling
  repoURL: https://bedag.github.io/helm-charts
  chartName: raw
  namespace: cilium
  version: 2.0.*
  options:
    waitForJobs: true
    wait: true
    timeout: 5m
  valuesTemplate: |
    templates:
      - |
        apiVersion: "cilium.io/v2alpha1"
        kind: CiliumL2AnnouncementPolicy
        metadata:
          name: l2-announcement-policy
        spec:
          nodeSelector:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
          externalIPs: true
          loadBalancerIPs: true
      - |
        apiVersion: "cilium.io/v2alpha1"
        kind: CiliumLoadBalancerIPPool
        metadata:
          name: "tooling-pool"
        spec:
          blocks:
            - start: "10.77.100.211"
              stop: "10.77.100.220"
