[defaults]
roles_path   = ./roles
host_key_checking = False
interpreter_python = auto_silent
deprecation_warnings = False
# host_key_checking en False a proposito: cada `tofu apply` puede traer una
# instancia nueva con la misma IP publica que una anterior (VPC/EIP de lab,
# efimera), lo que rompe known_hosts con un mismatch. Aceptable para un
# lab descartable; no usar este ansible.cfg como base para produccion.
