---
- name: Instalar y configurar Proxmox VE sobre la instancia
  hosts: proxmox
  become: true

  pre_tasks:
    # El role tambien instala gpg (tasks/main.yml, "Ensure gpg is
    # installed"), pero lo hace recien antes de confiar la key de
    # Proxmox - varios pasos despues de que apt ya necesita gpg/gpgv
    # disponible para verificar firmas de repos. Lo adelantamos aca para
    # que este disponible desde el arranque del play.
    - name: Instalar gpg
      ansible.builtin.apt:
        name: gpg
        state: present
        update_cache: true

    # Proxmox VE registra el nodo con el hostname vigente al momento de
    # instalarse. Sin esto, quedaria el hostname dinamico que le pone
    # cloud-init en AWS (variable por instancia), y ningun modulo de
    # proxmox-terraform/ ni manifiesto de Cluster API podria referenciar
    # el nodo con un nombre fijo.
    - name: Fijar un hostname estable para el nodo Proxmox VE
      ansible.builtin.hostname:
        name: proxmox-lab

    # proxmox-terraform/02-vm-template sube un snippet de cloud-init por
    # SSH (limitacion conocida del provider bpg: el API de Proxmox no
    # soporta subir snippets via token, solo backups/ISOs/snippets via
    # SSH) - por eso root necesita poder conectarse por SSH con la misma
    # key que ya usa Terraform para "admin". PermitRootLogin por password
    # sigue deshabilitado; solo se habilita por clave publica.
    - name: Derivar la clave publica de la key pair que genero Terraform
      ansible.builtin.set_fact:
        _instance_public_key: "{{ lookup('ansible.builtin.pipe', 'ssh-keygen -y -f ' + ansible_ssh_private_key_file) }}"

    - name: Autorizar esa misma clave tambien para conectarse como root
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ _instance_public_key }}"

  roles:
    - role: lae.proxmox
      vars:
        # Sin esto no se completa la instalacion: el role necesita
        # reiniciar despues de instalar el kernel PVE antes de poder
        # instalar los paquetes de proxmox-ve. El resto de las opciones
        # (repo pve-no-subscription, /etc/hosts, etc.) se dejan en su
        # default, que ya es lo que necesitamos para un nodo solo.
        pve_reboot_on_kernel_update: true

  tasks:
    # La UI web de Proxmox (8006) autentica "root" via PAM con password,
    # no con la key SSH de la instancia. Las imagenes cloud de Debian no
    # traen password de root seteado, asi que generamos uno random.
    - name: Generar password random para el usuario root
      ansible.builtin.set_fact:
        proxmox_root_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: Aplicar el password generado al usuario root
      ansible.builtin.shell:
        cmd: "echo 'root:{{ proxmox_root_password }}' | chpasswd"
        executable: /bin/bash
      no_log: true
      changed_when: true

    - name: Guardar el password en el host para poder recuperarlo por SSH
      ansible.builtin.copy:
        content: "{{ proxmox_root_password }}\n"
        dest: /root/.proxmox-root-password
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # La instancia EC2 solo trae una interfaz con IP publica - sin un
    # bridge propio, capmox no tiene donde conectar la red de las VMs que
    # crea (falla con "bridge 'vmbr0' does not exist" al arrancarlas).
    # Se arma un bridge puramente virtual (sin interfaz fisica colgando)
    # con NAT hacia la interfaz real, siguiendo la convencion de red ya
    # usada en todo el resto del taller (10.77.100.0/24).
    - name: Habilitar IP forwarding para el NAT de las VMs anidadas
      ansible.builtin.copy:
        content: "net.ipv4.ip_forward=1\n"
        dest: /etc/sysctl.d/99-vmbr0-nat.conf
        owner: root
        group: root
        mode: "0644"
      register: _sysctl_vmbr0_nat

    - name: Aplicar el sysctl si cambio
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-vmbr0-nat.conf
      when: _sysctl_vmbr0_nat.changed
      changed_when: true

    - name: Agregar el bridge vmbr0 con NAT para las VMs anidadas
      ansible.builtin.blockinfile:
        path: /etc/network/interfaces
        marker: "# {mark} ANSIBLE MANAGED BLOCK - vmbr0 NAT"
        block: |
          auto vmbr0
          iface vmbr0 inet static
              address 10.77.100.1/24
              bridge-ports none
              bridge-stp off
              bridge-fd 0
              post-up iptables -t nat -A POSTROUTING -s '10.77.100.0/24' -o {{ ansible_facts['default_ipv4']['interface'] }} -j MASQUERADE
              post-down iptables -t nat -D POSTROUTING -s '10.77.100.0/24' -o {{ ansible_facts['default_ipv4']['interface'] }} -j MASQUERADE
      register: _vmbr0_interfaces_conf

    - name: Levantar vmbr0 sin reiniciar el nodo (ifupdown2)
      ansible.builtin.command: ifreload -a
      when: _vmbr0_interfaces_conf.changed
      changed_when: true

    # image-builder (Packer) necesita DHCP para la VM de build - el plugin
    # de Packer para Proxmox no soporta IP estatica (confirmado contra la
    # doc oficial y el codigo del builder). El resto de esta red usa IPs
    # estaticas a proposito, asi que el rango de DHCP se acota para no
    # chocar con nada: gateway .1, VIPs .2/.3, nodos .10-.50, LB .200-.220.
    - name: Instalar dnsmasq (DHCP para la VM de build de image-builder)
      ansible.builtin.apt:
        name: dnsmasq
        state: present
        update_cache: true

    - name: Deshabilitar dnsmasq como resolver systemd-resolved (solo lo usamos para DHCP)
      ansible.builtin.systemd:
        name: systemd-resolved
        state: started
        enabled: true

    - name: Configurar dnsmasq - solo DHCP en vmbr0, sin DNS
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/vmbr0-image-builder.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Generado por Ansible (playbook.yml) - DHCP solo para la VM de
          # build de image-builder/Packer, acotado para no chocar con las
          # IPs estaticas del resto de la red (ver 04-image-builder/README.md).
          port=0
          interface=vmbr0
          bind-interfaces
          dhcp-range=10.77.100.100,10.77.100.150,12h
          dhcp-option=3,10.77.100.1
          dhcp-option=6,1.1.1.1
      register: _dnsmasq_conf

    - name: Reiniciar dnsmasq si cambio la config
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted
        enabled: true
      when: _dnsmasq_conf.changed

    - name: Asegurar que dnsmasq este arriba
      ansible.builtin.systemd:
        name: dnsmasq
        state: started
        enabled: true

  post_tasks:
    - name: Mostrar como acceder
      ansible.builtin.debug:
        msg: >-
          Proxmox VE listo. UI: https://{{ ansible_host }}:8006
          (usuario root, password en /root/.proxmox-root-password -
          recuperalo con: ssh -i <key> {{ ansible_user }}@{{ ansible_host }}
          sudo cat /root/.proxmox-root-password)
